[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treetask"
version = "0.1.0"
description = "Native desktop task manager that grows a plant as you complete tasks."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "TreeTask Contributors"}]
keywords = ["tasks", "productivity", "todo", "plant"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7"
]

[project.scripts]
treetask = "treetask.__main__:main"

[tool.setuptools.package-data]
treetask = ["plant_stage*.png", "icon.svg"]
